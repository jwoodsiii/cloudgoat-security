# .github/workflows/policy.yml
on:
  push:
    branches: [main]
    paths:
      - 'policy/**'
      - 'fixtures/**'
  pull_request:
    paths:
      - 'policy/**'
      - 'fixtures/**'

jobs:
  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.55.0/conftest_0.55.0_Linux_x86_64.tar.gz \
            | tar xz
          sudo mv conftest /usr/local/bin

      - name: Install OPA
        run: |
          curl -sL https://openpolicyagent.org/downloads/latest/opa_linux_amd64 \
            -o /usr/local/bin/opa
          chmod +x /usr/local/bin/opa

      - name: Run conftest against fixtures
        run: |
          for fixture in fixtures/*.json; do
            echo "--- Testing $fixture ---"
            conftest test "$fixture" -p policy/
          done

      - name: Run OPA unit tests
        run: opa test policy/ -v
